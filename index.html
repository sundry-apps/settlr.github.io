<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settlr – Split expenses. Settle up.</title>
    <meta name="description"
        content="Settlr makes splitting bills and settling up with friends simple. Track group expenses, balances, and settle with one tap." />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8f8f5, #f0f4ff, #faf8ff);
            color: #14181f;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .blob-teal {
            width: 320px;
            height: 320px;
            top: -60px;
            left: -80px;
            background: radial-gradient(circle, rgba(28, 194, 159, 0.35), rgba(28, 194, 159, 0) 70%);
            animation: floatTeal 16s ease-in-out infinite;
        }

        .blob-orange {
            width: 360px;
            height: 360px;
            top: 260px;
            right: -100px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.25), rgba(255, 69, 0, 0) 70%);
            animation: floatOrange 20s ease-in-out infinite;
        }

        .blob-indigo {
            width: 260px;
            height: 260px;
            bottom: 40px;
            left: 60px;
            background: radial-gradient(circle, rgba(92, 107, 192, 0.25), rgba(92, 107, 192, 0) 70%);
            animation: floatIndigo 18s ease-in-out infinite;
        }

        @keyframes floatTeal {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(90px, 60px);
            }

            50% {
                transform: translate(40px, 140px);
            }

            75% {
                transform: translate(-60px, 50px);
            }
        }

        @keyframes floatOrange {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-80px, 70px);
            }

            50% {
                transform: translate(-120px, -40px);
            }

            75% {
                transform: translate(-30px, -90px);
            }
        }

        @keyframes floatIndigo {

            0%,
            100% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(70px, -60px);
            }

            66% {
                transform: translate(100px, 40px);
            }
        }

        header,
        main,
        footer {
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 2vh, 20px) clamp(20px, 4vw, 40px);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #14181f;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
        }

        nav a {
            color: #55607a;
            text-decoration: none;
            font-size: 0.9rem;
            margin-left: 24px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #14181f;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(8px, 2vh, 24px) 24px;
            gap: clamp(10px, 2vh, 22px);
            min-height: 0;
        }

        .hero-logo {
            width: clamp(56px, 5vw + 5vh, 96px);
            height: clamp(56px, 5vw + 5vh, 96px);
            border-radius: 24%;
            box-shadow: 0 8px 28px rgba(20, 24, 31, 0.15);
        }

        h1 {
            font-size: clamp(1.5rem, 1.8vw + 2vh, 2.9rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            max-width: 700px;
        }

        h1 span {
            background: linear-gradient(135deg, #1cc29f, #5c6bc0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(0.95rem, 0.7vw + 1.3vh, 1.2rem);
            color: #55607a;
            max-width: 520px;
            line-height: 1.5;
        }

        .store-badges {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .store-badges a img {
            height: clamp(40px, 6.5vh, 62px);
            object-fit: contain;
        }

        .store-badges a img.google-play-badge {
            height: clamp(58px, 9.2vh, 96px);
        }

        footer {
            text-align: center;
            padding: clamp(8px, 1.5vh, 20px) 24px;
            border-top: 1px solid rgba(20, 24, 31, 0.08);
            font-size: 0.72rem;
            color: #7c8494;
            flex-shrink: 0;
        }

        footer a {
            color: #55607a;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            color: #14181f;
        }

        @media (max-height: 600px) {
            .hero-logo {
                display: none;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 16px 20px;
            }

            nav a {
                margin-left: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="blob blob-teal"></div>
    <div class="blob blob-orange"></div>
    <div class="blob blob-indigo"></div>

    <header>
        <div class="logo"><img src="/assets/logo.png" alt="Settlr logo" class="logo-icon" /> Settlr</div>
        <nav>
            <a href="/support.html">Support</a>
            <a href="/privacy-policy.html">Privacy</a>
            <a href="/download.html">Download</a>
        </nav>
    </header>

    <main>
        <img src="/assets/logo.png" alt="Settlr logo" class="hero-logo" />

        <h1>Split expenses.<br /><span>Settle up effortlessly.</span></h1>

        <p class="subtitle">
            Settlr makes it easy to track shared expenses with friends, family, and housemates —
            and settle debts in one tap.
        </p>

        <div class="store-badges">
            <a href="https://apps.apple.com/gr/app/settlr-expense-splitter/id6762055449">
                <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                    alt="Download on the App Store" />
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.sundry.settlr">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                    alt="Get it on Google Play" class="google-play-badge" />
            </a>
        </div>
    </main>

    <footer>
        <p>
            <a href="/privacy-policy.html">Privacy Policy</a>
            <a href="/terms-and-conditions.html">Terms</a>
            <a href="/support.html">Support</a>
            <a href="/delete-account-instructions.html">Delete Account</a>
        </p>
        <p style="margin-top: 12px;">&copy; 2026 Settlr. All rights reserved.</p>
    </footer>
</body>

</html>
