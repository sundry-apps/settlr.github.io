<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Settlr</title>
    <meta name="description" content="Download Settlr for iOS and Android." />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="/store_auto_redirect.js" defer></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8f8f5, #f0f4ff, #faf8ff);
            color: #14181f;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(16px, 4vh, 40px) 24px;
            gap: clamp(8px, 1.6vh, 16px);
            position: relative;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .blob-teal {
            width: 320px;
            height: 320px;
            top: -60px;
            left: -80px;
            background: radial-gradient(circle, rgba(28, 194, 159, 0.35), rgba(28, 194, 159, 0) 70%);
            animation: floatTeal 16s ease-in-out infinite;
        }

        .blob-orange {
            width: 360px;
            height: 360px;
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.25), rgba(255, 69, 0, 0) 70%);
            animation: floatOrange 20s ease-in-out infinite;
        }

        @keyframes floatTeal {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(90px, 60px);
            }

            50% {
                transform: translate(40px, 140px);
            }

            75% {
                transform: translate(-60px, 50px);
            }
        }

        @keyframes floatOrange {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-80px, 70px);
            }

            50% {
                transform: translate(-120px, -40px);
            }

            75% {
                transform: translate(-30px, -90px);
            }
        }

        h1,
        p,
        .brand,
        .badges,
        .back {
            position: relative;
            z-index: 1;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #14181f;
        }

        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
        }

        h1 {
            font-size: clamp(1.6rem, 2.4vw + 2.4vh, 2.4rem);
            font-weight: 700;
        }

        p {
            color: #55607a;
            line-height: 1.5;
            font-size: clamp(0.95rem, 0.7vw + 1.2vh, 1.15rem);
        }

        .badges {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .badges a img {
            height: clamp(40px, 6.5vh, 62px);
            object-fit: contain;
        }

        .badges a img.google-play-badge {
            height: clamp(58px, 9.2vh, 96px);
        }

        .back {
            color: #7c8494;
            font-size: 0.85rem;
        }

        .back a {
            color: #55607a;
            text-decoration: none;
        }

        .back a:hover {
            color: #14181f;
        }
    </style>
</head>

<body>
    <div class="blob blob-teal"></div>
    <div class="blob blob-orange"></div>

    <div class="brand"><img src="/assets/logo.png" alt="Settlr logo" /> Settlr</div>

    <h1>Download Settlr</h1>
    <p>Redirecting you to the right store…<br />If nothing happens, pick your platform below.</p>

    <div class="badges">
        <a href="https://apps.apple.com/gr/app/settlr-expense-splitter/id6762055449">
            <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                alt="Download on the App Store" />
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.sundry.settlr">
            <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                alt="Get it on Google Play" class="google-play-badge" />
        </a>
    </div>

    <div class="back"><a href="/">← Back to settlr.sundryapps.tech</a></div>
</body>

</html>
